services:
  - type: web
    name: dresscode-real-tryon
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: RESEND_API_KEY
        sync: false
      - key: AUTH_EMAIL_FROM
        sync: false
      - key: AUTH_FRONTEND_URL
        value: https://biwotony.github.io/dresscode-virtual-stylist/
      - key: AUTH_MAGIC_LINK_MINUTES
        value: 15
      - key: AUTH_SESSION_DAYS
        value: 30
      - key: AUTH_ASSET_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_API_BASE_URL
        value: https://api.openai.com/v1
      - key: OPENAI_VISION_MODEL
        value: gpt-5-mini
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-1
      - key: OPENAI_IMAGE_QUALITY
        value: high
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_CURRENCY
        value: KES
      - key: PAYSTACK_SUBUNIT
        value: 100
      - key: PAYSTACK_CHANNELS
        value: mobile_money,card
      - key: PAYSTACK_CALLBACK_URL
        value: https://biwotony.github.io/dresscode-virtual-stylist/
      - key: PAYMENTS_REQUIRED
        value: true
      - key: DRESSCODE_DATA_DIR
        value: /var/data/dresscode
      - key: DRESSCODE_RETENTION_DAYS
        value: 7
      - key: CORS_ORIGIN
        value: https://biwotony.github.io
    disk:
      name: dresscode-runtime
      mountPath: /var/data
      sizeGB: 1
