services:
  - type: web
    name: dresscode-real-tryon
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_API_BASE_URL
        value: https://api.openai.com/v1
      - key: OPENAI_VISION_MODEL
        value: gpt-5-mini
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-1
      - key: OPENAI_IMAGE_QUALITY
        value: high
      - key: DRESSCODE_DATA_DIR
        value: /var/data/dresscode
      - key: CORS_ORIGIN
        value: https://biwotony.github.io
    disk:
      name: dresscode-runtime
      mountPath: /var/data
      sizeGB: 1
